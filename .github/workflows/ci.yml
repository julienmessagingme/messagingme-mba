name: CI

# 🔴 UN COMMIT DOCS-ONLY NE LANCE PAS LA CI (2026-09-04). En septembre, 36 % des runs venaient de commits
# `docs:` pur (README, .md dans docs/, audits) qui montaient Postgres et jouaient toute la suite pour ZÉRO
# ligne de code, soit ~660 min facturées, un tiers du quota mensuel du plan gratuit. `paths-ignore` saute la
# CI quand un push ne touche QUE des `.md` ; un commit qui mêle doc ET code la relance normalement.
# ⚠️ Tient parce qu'on n'a pas de branch protection avec check requis (solo sur main, pas de PR) : sinon un
# run sauté laisserait le check « en attente ».
# 🔴 ET ON PEUT LA RÉCLAMER À LA MAIN, parce que `paths-ignore` a un angle mort mesuré le 2026-09-24 : le
# job `unit` joue `tests/aide-proposer.test.ts` et `tests/aide-fiches-format.test.ts`, qui LISENT les `.md` de
# `docs/aide/fiches/`. Un mot changé dans `features.md` a donc rendu la CI ROUGE, et le commit qui réparait les
# deux empreintes ne touchant QUE des `.md`, aucun run n'a pu enregistrer le retour au vert : le dernier
# verdict au tableau restait l'échec, juste avant un déploiement. `workflow_dispatch` permet d'en réclamer un
# sur la tête courante (`gh workflow run ci.yml --ref main`) sans fabriquer un commit de code pour ça.
# ⚠️ Il ne remplace PAS `paths-ignore`, qui reste la raison d'être du dispositif (un tiers du quota mensuel
# brûlé par des commits docs, mesuré le 2026-09-04) : il en est la porte de secours, à la demande.
# 🔴 `site/` (la vitrine statique) a été ignoré du 2026-09-25 au lot 18 (2026-10-12) : aucun test ne la lisait.
# Depuis, `tests/vitrine-developpeurs.test.ts` la lit (les chiffres de l'offre, la commande Claude Code, les outils
# montrés) : un push de la vitrine seule lance donc la CI, sinon une page fausse ne rougirait que le commit suivant.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'

# Un push annule le run précédent devenu obsolète sur la même branche, au lieu de tous les jouer. Pendant un
# cycle d'audit (66 pushs en une journée le 2026-09-02), seul le dernier compte : on ne déploie que HEAD, et
# le dernier run le couvre. ⚠️ Effet de bord assumé : un commit intermédiaire annulé n'a pas de check vert à
# lui, ce qui est sans importance ici puisqu'on ne déploie jamais un commit du milieu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔴 SECURITE : CE QUI BLOQUE, ET CE QUI RESTE UNE TRACE (plan RSSI du 2026-09-09 ; seuils du lot 6 du bilan des
  # audits, livraison B2). BLOQUENT : les failles hautes et critiques des dependances de PRODUCTION de l API et de la
  # console (`scripts/audit-production.ts`, exceptions datees dans `scripts/audit-exceptions.json`), les failles
  # critiques de l image de l API, et l uid des deux images. RESTENT UNE TRACE : gitleaks, semgrep, l audit complet
  # (developpement compris) et les failles hautes des images. Un controle ne bloque que sur un perimetre qu on sait
  # tenir : un job qui casse au premier CVE transitif d un outil de build est un job qu on desactive au bout de deux
  # jours. La regle et la procedure d exception : `documentation.md` § les controles de securite de la CI.
  #
  # ⚠️ gitleaks tourne DEJA en pre-commit sur le poste de Julien (hook global). Ce n est pas un doublon :
  # un hook local protege une machine, pas le depot. Il ne voit ni un commit fait ailleurs, ni un
  # `--no-verify`, ni l historique.
  securite:
    runs-on: ubuntu-latest
    env:
      # 🔴 EPINGLE PAR VERSION ET PAR EMPREINTE, jamais `latest` : ce conteneur recoit la socket Docker du runner,
      # et une etiquette mobile executerait ce que l editeur publie au moment du run, sans relecture. Monter de
      # version = changer les deux, sur une version publiee depuis au moins deux semaines.
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@v5
        with:
          # L historique complet : gitleaks compare des commits, un clone superficiel ne lui donnerait
          # qu un instantane et il ne verrait pas un secret introduit puis retire.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Secrets committes (gitleaks)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Une etape par dossier : enchainees dans un meme `run`, le `bash -e` s arretait apres le premier audit en
      # echec, et celui de la console ne tournait jamais.
      - name: Dependances de PRODUCTION de l API (npm audit, bloquant)
        run: npx tsx scripts/audit-production.ts .
      - name: Dependances de PRODUCTION de la console (npm audit, bloquant)
        run: npx tsx scripts/audit-production.ts web
      - name: Toutes les dependances de l API, developpement compris (npm audit, trace)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Toutes les dependances de la console, developpement compris (npm audit, trace)
        continue-on-error: true
        run: npm --prefix web audit --audit-level=high
      - name: Analyse statique (semgrep, regles publiques TypeScript)
        continue-on-error: true
        # Regles publiques, sans compte ni jeton : le premier niveau, rapide. L analyse plus profonde est CodeQL,
        # dans son propre workflow (`codeql.yml`), gratuite parce que le depot est public.
        run: |
          pipx install semgrep || pip install semgrep
          semgrep --config=p/typescript --config=p/secrets --error --quiet --metrics=off src web/lib web/app
      # L image de node (les builds) et celle de trivy viennent de Docker Hub : avec le compte de Julien (jeton en
      # lecture seule), pas le quota anonyme partage par les runners de GitHub, qui rendait ce job rouge
      # (`toomanyrequests`). Posee JUSTE AVANT leurs consommateurs : les scripts d installation des etapes d avant ne
      # voient pas l identifiant. Jeton expire, revoque ou secret absent : cette etape echoue en le disant.
      - name: Connexion a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image de l API (construction)
        run: docker build -t mba-api:ci .
      - name: Image de l API, failles hautes et critiques (trivy, trace)
        continue-on-error: true
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" image --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln mba-api:ci
      - name: Image de l API, failles critiques (trivy, bloquant)
        # `--ignore-unfixed` : une faille sans correctif publie ne se corrige pas en reconstruisant, elle ne bloque pas.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" image --severity CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln mba-api:ci
      - name: L image de l API ne tourne PAS en root
        # 🔴 BLOQUANT, et sans base exterieure : il verifie une propriete que NOUS avons choisie et que nous pouvons
        # tenir. Un `USER node` retire par megarde dans un futur Dockerfile passerait autrement inapercu.
        run: |
          test "$(docker run --rm mba-api:ci id -u)" = "1000"
          echo "OK : le conteneur de l API tourne en uid 1000 (node)"
      # La console du VPS (`mba-web`, qui sert encore `mba.messagingme.app`) : la console de Vercel n est pas une image.
      - name: Image de la console (construction)
        run: docker build -f web/Dockerfile -t mba-web:ci .
      - name: Image de la console, failles hautes et critiques (trivy, trace)
        continue-on-error: true
        # ⚠️ Pas encore de seuil bloquant : il se pose, comme pour l API, une fois la premiere mesure lue a zero.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" image --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln mba-web:ci
      - name: L image de la console ne tourne PAS en root
        run: |
          test "$(docker run --rm mba-web:ci id -u)" = "1000"
          echo "OK : le conteneur de la console tourne en uid 1000 (node)"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Même version que les images de production (node:22-alpine, Dockerfile et web/Dockerfile).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 🔴 L'auto-attaque tourne ICI, et c'est la seule chose qui la rend utile. Elle inventorie les routes
      # sur le SERVEUR CONSTRUIT et attaque chacune : une route ajoutee sans garde est trouvee sans que
      # personne y pense. Un outil qu'on ne lance qu'a la main est un outil qu'on ne relance jamais apres un
      # refactor. Elle sort en code 1 sur trouvaille, donc elle casse la CI, ce qui est le but.
      # Sans argument, elle vise `local` : serveur monte en memoire, aucune base, aucun reseau, aucun effet.
      - name: Auto-attaque (gardes d'autorisation sur les routes reelles)
        run: npx tsx scripts/auto-attaque.mts

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 🔴 pgvector, PAS `postgres:16` nu. La migration 0110 pose `create extension vector`, et une CI qui
        # ne peut pas la jouer ne prouve plus rien du schema de production : elle s'arreterait a la 0109 et
        # les tests d'integration tourneraient sur une base a laquelle il manque une colonne. Vu le
        # 2026-09-02, `extension "vector" is not available` sur l'image nue. La production (Supabase) a
        # l'extension DISPONIBLE (`vector` 0.8.2, verifie en base) : c'est la CI qu'on aligne sur elle.
        image: pgvector/pgvector:pg16
        # Tirée avec le compte Docker Hub de Julien (jeton en lecture seule), pas en anonyme : le quota anonyme,
        # partagé par les runners de GitHub, rendait ce job rouge (`toomanyrequests`) sans qu'il ait rien vérifié.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres LOCAL sans TLS -> SSL désactivé (sinon « server does not support SSL »).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_SSL: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Même version que les images de production (node:22-alpine, Dockerfile et web/Dockerfile).
          node-version: 22
          cache: npm
      - run: npm ci
      # Cle de chiffrement JETABLE, tiree a chaque execution. Les tests du store de boites SMTP verifient que le
      # mot de passe est chiffre au repos, donc ils exigent une cle de 32 octets ; sans elle, le job d'integration
      # echoue a CHAQUE push (constate le 2026-08-19, CI rouge en continu). Generee ici plutot qu'ecrite en dur :
      # une cle en clair dans le depot serait un mauvais exemple, et un secret de depot serait de la ceremonie
      # pour une valeur qui ne protege rien de reel.
      - name: Cle de chiffrement ephemere (tests du store SMTP)
        run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migrations (crée le schéma applicatif)
        run: npm run migrate
      - name: Tests d'intégration (pg-boss + stores + e2e contre Postgres éphémère)
        run: npm run test:integration

# 🔴 LE JOB `web` A DEMENAGE dans `.github/workflows/ci-web.yml` le 2026-09-15, pour ne tourner que quand
# `web/**` bouge. Il ne peut pas voir un changement de backend (aucun import de `src/` depuis `web/`, et les
# E2E interceptent tous les appels `/api/backend/**`), et il coutait 8,8 minutes a 47 % des pushs qui ne
# touchaient que le backend. ⚠️ NE PAS le remettre ici : il tournerait DEUX fois sur un push au front.
# ⚠️ Et ne PAS filtrer ce fichier-ci sur le backend : 43 tests de `unit` lisent des fichiers de `web/`.
