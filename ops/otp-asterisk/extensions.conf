; LE PLAN DE NUMEROTATION DU PONT DU CODE (lot 3a). Tout appel recu sur un numero de la reserve (DIDWW met le numero
; appele dans la R-URI, use_did_in_ruri) est decroche et enregistre 90 secondes au plus, en chemin ABSOLU (un chemin
; relatif ecrivait dans le dossier des sons d'Asterisk, mesure le 2026-10-05). A la fin de l'enregistrement, quelle
; qu'elle soit (Meta raccroche, ou les 90 secondes), le script part en arriere-plan : il signe et poste
; l'enregistrement a l'API.
;
; 🔴 ${EXTEN} VIENT DE L'APPELANT (la R-URI de l'INVITE) et System() l'execute par sh -c : colle tel quel, un
; « 1;commande; » serait execute (relecture du lot 3a). Il est donc reduit a ses CHIFFRES par FILTER avant tout usage,
; et l'appel est raccroche si rien n'en reste. UNIQUEID est genere par Asterisk, filtre quand meme. Ne jamais mettre
; une variable de l'appel dans System() sans FILTER, ni dans la commande de MixMonitor, que sh -c execute aussi :
; tests/otp-asterisk-config.test.ts le refuse.
[otp-entrant]
exten => _X.,1,Set(NUMERO_APPELE=${FILTER(0123456789,${EXTEN})})
 same => n,GotoIf($["${NUMERO_APPELE}" = ""]?refuser)
 same => n,Set(APPEL_ID=${FILTER(0123456789.,${UNIQUEID})})
 same => n,Set(FICHIER_OTP=/var/spool/asterisk/monitor/otp-${NUMERO_APPELE}-${APPEL_ID}.wav)
 same => n,NoOp(APPEL ENTRANT sur ${NUMERO_APPELE})
 same => n,Answer()
 same => n,Wait(1)
; L'enregistrement tourne en ARRIERE-PLAN (MixMonitor) pour pouvoir appuyer sur des touches pendant qu'il court :
; l'appel de l'application WhatsApp dit « appuyez sur 5 » avant de dicter son code, et sans touche il ne le dit jamais
; (mesure sur la reserve le 2026-10-21). Celui de Meta (Cloud API) n'attend aucune touche et dicte son code des le
; decroche : il est enregistre depuis la premiere seconde, et la touche, envoyee hors du son (dtmf_mode = rfc4733),
; ne s'entend pas dans l'enregistrement. A la fin de l'enregistrement (Meta raccroche, ou les 90 secondes), MixMonitor
; lance le script qui signe et poste a l'API ; le fichier est alors ferme, ce que l'extension h ne garantissait pas.
 same => n,MixMonitor(${FICHIER_OTP},,/otp/envoyer-otp.sh ${NUMERO_APPELE} ${APPEL_ID} ${FICHIER_OTP} &)
 same => n,Wait(2)
 same => n,SendDTMF(5)
 same => n,Wait(3)
 same => n,SendDTMF(5)
 same => n,Wait(3)
 same => n,SendDTMF(5)
 same => n,Wait(81)
 same => n,Hangup()
 same => n(refuser),Hangup()
