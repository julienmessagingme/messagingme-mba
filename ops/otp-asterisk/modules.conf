; LES MODULES DE L'ASTERISK DU PONT DU CODE (lot 3a). Le fichier de l'image andrius/asterisk:20-cert, plus UNE ligne :
; noload = chan_iax2.so. Ce conteneur ne parle que SIP (PJSIP, port 5080) ; l'IAX2, charge par defaut, ecoutait sur
; 4569/udp, ouvert au monde puisque le conteneur est en network_mode host, avec l'utilisateur [guest] du iax.conf par
; defaut (relecture de la session RSSI, 2026-10-05). Le fermer n'enleve rien au pont.
; ⚠️ Ce fichier REMPLACE celui de l'image : les noload de l'image sont recopies ci-dessous, ne pas les perdre.

[modules]
autoload=yes

noload = chan_alsa.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = chan_sip.so
noload = app_voicemail_imap.so
