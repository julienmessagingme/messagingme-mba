# Déploiement VPS : API + worker + frontend, tous sur le réseau NPM (mcp-robot_default).
# NPM atteint mba-web par nom de conteneur -> aucun port hôte exposé (pas d'accès public direct).
# Secrets/config dans .env.prod (NON commité, créé sur le VPS).
services:
  mba-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mba-api
    env_file: .env.prod
    restart: unless-stopped
    # 🔴 Docker envoie SIGKILL 10 s après le SIGTERM par défaut. Un travail en cours n'avait donc aucune chance
    # de sortir proprement. 30 s laisse au filet de 25 s de `installGracefulShutdown` le temps de servir.
    # ⚠️ Les deux vont ENSEMBLE : relever l'un sans l'autre ne change rien du tout.
    stop_grace_period: 30s
    # Healthcheck sur /live (LIVENESS, zéro DB) et NON /health (readiness) : une panne DB transitoire ou le
    # cold-start EMAXCONNSESSION (cf. DEPLOY.md) ferait boucler un restart si on ciblait /health. wget = busybox
    # (node:22-alpine, pas de curl). ⚠️ 127.0.0.1 et NON localhost : busybox wget résout localhost en ::1 (IPv6),
    # or l'app bind 0.0.0.0 (IPv4 seul) -> « Connection refused » sur ::1. (Quand 4.2 fera binder en ::, réévaluer.)
    # ⚠️ compose seul ne redémarre PAS sur « unhealthy » (il faut un autoheal externe) : signal d'observabilité (docker ps).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8095/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 🔴 LA TAILLE DE CHAQUE POOL EST ÉCRITE ICI, POUR CHAQUE SERVICE, et leur SOMME est tenue par
    # `tests/budget-pooler.test.ts` sous la taille du pool de Supabase (mesurée, pas supposée). Ajouter une copie
    # d'API, c'est ajouter un service ici : le test refuse alors le dépassement, et il faut redimensionner
    # chaque copie, ou monter le pool de Supabase dans la limite que le test calcule.
    environment:
      DB_POOL_MAX: "10"
    networks: [mcp-robot_default]

  mba-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mba-worker
    command: ["npx", "tsx", "src/worker.ts"]
    env_file: .env.prod
    restart: unless-stopped
    # 🔴 LE POINT QUI COMPTE POUR R4. C'est ici que tournent les runs de campagne : sans ce délai, un
    # déploiement les tuait en plein envoi (SIGKILL à 10 s, un run de deux heures n'a aucune chance), et la
    # campagne restait `running` sans que rien ne la reprenne. ⚠️ Ce délai seul ne suffit PAS : la garantie est
    # le balayage de reprise du worker, qui rattrape aussi les arrêts brutaux (panne, OOM, SIGKILL).
    stop_grace_period: 30s
    # LE RÔLE DE CE WORKER (src/worker/roles.ts) : le chemin que la production emprunte, webhooks entrants,
    # campagnes, scénarios, tours d'agent. 🔴 UN SEUL EXEMPLAIRE : `groupConcurrency` est local au processus
    # pg-boss, donc deux copies d'un même rôle doubleraient le plafond par espace et dédoubleraient les
    # minuteries. `environment` prime sur `env_file`.
    environment:
      WORKER_ROLE: principal
      # Ses tailles, explicites comme celles de chaque service (budget : `tests/budget-pooler.test.ts`).
      DB_POOL_MAX: "8"
      PGBOSS_MAX: "2"
    networks: [mcp-robot_default]

  # LE SECOND WORKER (2026-10-03) : l'analyse des conversations et ce qu'elle alimente, isolée du chemin chaud.
  # Ce qu'on achète est l'ISOLATION, pas du débit : un appel de modèle lent, un parsing lourd ou un redémarrage
  # de l'analyse ne doit plus retarder un message entrant ni une campagne. Même image, même code, même pg-boss.
  mba-worker-analyse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mba-worker-analyse
    command: ["npx", "tsx", "src/worker.ts"]
    env_file: .env.prod
    restart: unless-stopped
    environment:
      WORKER_ROLE: analyse
      # DIMENSIONNÉ PETIT : sa charge est légère (trois files de fond, une analyse par espace à la fois) et un
      # appel de modèle ne retient aucune connexion. Mesuré sur sa première journée : zéro attente de pool. Le
      # budget de tous les pools, et pourquoi c'est celui du POOLER qui mord : `tests/budget-pooler.test.ts`.
      DB_POOL_MAX: "3"
      PGBOSS_MAX: "2"
    stop_grace_period: 30s
    networks: [mcp-robot_default]

  mba-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # BACKEND_URL est GELÉ AU BUILD (rewrite Next figé dans routes-manifest.json) : il DOIT être un build arg,
      # pas une var d'environnement runtime. L'ancien `environment: BACKEND_URL` était un no-op (rien ne le lit au
      # runtime). ⚠️ Reste build-time : le rendre runtime (image portable Railway) = route handler proxy (item 4.4
      # option B, différé à la bascule Railway où il sera QA sur les golden paths). Cf. web/Dockerfile:7-11.
      args:
        BACKEND_URL: http://mba-api:8095
    container_name: mba-web
    restart: unless-stopped
    networks: [mcp-robot_default]

networks:
  mcp-robot_default:
    external: true
