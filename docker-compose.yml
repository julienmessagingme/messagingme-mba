# Déploiement VPS : API + worker + frontend, tous sur le réseau NPM (mcp-robot_default).
# NPM atteint mba-web par nom de conteneur -> aucun port hôte exposé (pas d'accès public direct).
# Secrets/config dans .env.prod (NON commité, créé sur le VPS).
services:
  mba-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mba-api
    env_file: .env.prod
    restart: unless-stopped
    # Healthcheck sur /live (LIVENESS, zéro DB) et NON /health (readiness) : une panne DB transitoire ou le
    # cold-start EMAXCONNSESSION (cf. DEPLOY.md) ferait boucler un restart si on ciblait /health. wget = busybox
    # (node:22-alpine, pas de curl). ⚠️ 127.0.0.1 et NON localhost : busybox wget résout localhost en ::1 (IPv6),
    # or l'app bind 0.0.0.0 (IPv4 seul) -> « Connection refused » sur ::1. (Quand 4.2 fera binder en ::, réévaluer.)
    # ⚠️ compose seul ne redémarre PAS sur « unhealthy » (il faut un autoheal externe) : signal d'observabilité (docker ps).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8095/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [mcp-robot_default]

  mba-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mba-worker
    command: ["npx", "tsx", "src/worker.ts"]
    env_file: .env.prod
    restart: unless-stopped
    networks: [mcp-robot_default]

  mba-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # BACKEND_URL est GELÉ AU BUILD (rewrite Next figé dans routes-manifest.json) : il DOIT être un build arg,
      # pas une var d'environnement runtime. L'ancien `environment: BACKEND_URL` était un no-op (rien ne le lit au
      # runtime). ⚠️ Reste build-time : le rendre runtime (image portable Railway) = route handler proxy (item 4.4
      # option B, différé à la bascule Railway où il sera QA sur les golden paths). Cf. web/Dockerfile:7-11.
      args:
        BACKEND_URL: http://mba-api:8095
    container_name: mba-web
    restart: unless-stopped
    networks: [mcp-robot_default]

networks:
  mcp-robot_default:
    external: true
